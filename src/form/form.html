<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Ajouter un jeu – LudoZone</title>
    <script type="module" src="./form.js"></script>
  </head>
  <body>
    <header>
      <h1>LudoZone</h1>
      <nav>
        <a href="../index.html">Accueil</a>
        <a href="./form.html">Ajouter</a>
        <a href="../auth/register.html">Inscription</a>
        <a href="../auth/login.html">Connexion</a>
        <a href="../cart/cart.html">Panier</a>
      </nav>
    </header>
    <a href="../index.html" class="link-back">← Retour</a>
    <h2>Ajouter un jeu de société</h2>
    <form>
      <input type="text" name="nom" placeholder="Nom du jeu" />
      <input type="text" name="maison" placeholder="Maison d’édition" />
      <input type="text" name="prix" placeholder="Prix en dollars" />
      <input type="text" name="image" placeholder="Lien de l'image" />
      <textarea name="description" placeholder="Description du jeu"></textarea>
      <ul id="errors" class="errors"></ul>
      <button type="submit">Ajouter</button>
    </form>
  </body>
</html>
